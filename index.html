<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour Manager</title>
<style>
  :root{
    --court: #4B2482;
    --court-line: #F3E9FF;
    --clay: #E3056E;
    --ink: #1E1029;
    --paper: #F8F5FB;
    --paper-2: #EDE3F6;
    --accent: #FBEB14;
    --ok: #3E7D5A;
    --danger: #B4432E;
    font-size: 15px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  html, body{width:100%;}
  .app{width:100%;margin:0;padding:18px 24px 60px;box-sizing:border-box;}
  header.top{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    border-bottom:3px solid var(--court); padding-bottom:10px; margin-bottom:14px; flex-wrap:wrap;
  }
  header.top h1{
    font-size:22px; margin:0; letter-spacing:0.02em; font-weight:800;
    text-transform:uppercase;
  }
  header.top h1 span{color:var(--clay);}
  .week-pill{
    background:var(--court); color:var(--court-line); font-weight:700;
    padding:6px 14px; border-radius:2px; font-size:13px; letter-spacing:.03em; text-align:right;
  }
  .week-pill small{display:block;font-weight:500;opacity:.75;font-size:11px;}
  nav.tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid #DDD0EE; flex-wrap:wrap;}
  nav.tabs button{
    background:none;border:none;padding:10px 14px;font-size:13.5px;font-weight:700;
    letter-spacing:.03em;text-transform:uppercase;cursor:pointer;color:#7A5A9E;
    border-bottom:3px solid transparent; margin-bottom:-1px;
  }
  nav.tabs button.active{color:var(--court); border-bottom-color:var(--clay);}
  section.panel{display:none;}
  section.panel.active{display:block;}

  .card{background:#fff;border:1px solid #E1D3F2;border-radius:6px;padding:16px;margin-bottom:14px;}
  .card h2{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--court);}
  .muted{color:#7C6A94;font-size:12.5px;}

  .month-label{font-weight:800;color:var(--clay);text-transform:uppercase;font-size:12px;letter-spacing:.08em;margin:18px 0 6px;}
  .month-label:first-child{margin-top:0;}
  .week-block{border:1px solid transparent;border-radius:5px;margin-bottom:2px;}
  .week-block.current-week{border-color:var(--accent);background:#FDF6E0;}
  .event-row{
    display:flex; align-items:center; gap:12px; padding:9px 10px; border-radius:4px;
  }
  .event-row + .event-row{border-top:1px solid #eee7d5;}
  .event-row.completed{opacity:.7;}
  .status-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .status-dot.completed{background:var(--ok);}
  .status-dot.current{background:var(--accent);}
  .status-dot.upcoming{background:#cfc9b8;}
  .ev-week{font-size:11px;color:#9784B3;width:34px;flex:none;}
  .ev-name{font-weight:700;flex:1;min-width:160px;}
  .ev-city{font-size:12px;color:#7C6A94;flex:1;min-width:140px;}
  .ev-cat{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--paper-2);flex:none;}
  .ev-result{font-size:12px;color:#2E1E3F;flex:2;min-width:200px;}
  .btn{
    background:var(--court); color:#fff; border:none; padding:8px 14px; border-radius:4px;
    font-weight:700; font-size:12.5px; cursor:pointer; letter-spacing:.02em; text-transform:uppercase;
  }
  .btn:hover{background:#371a63;}
  .btn.secondary{background:transparent;color:var(--court);border:1.5px solid var(--court);}
  .btn.secondary:hover{background:#F1E7FA;}
  .btn.small{padding:5px 10px;font-size:11px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#5C4478;display:block;margin-bottom:4px;}
  input[type=text], input[type=number], select{
    width:100%; padding:7px 8px; border:1px solid #D3C0E8; border-radius:4px; font-size:14px; background:#FFFDFB;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .field{margin-bottom:12px;}
  .seed-entry{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .seed-entry .snum{width:26px;font-weight:800;color:var(--clay);font-size:13px;text-align:right;}
  .seed-entry input{flex:1;}

  .bracket-wrap{overflow-x:auto;padding-bottom:10px;}
  .bracket{display:flex;gap:34px;min-width:max-content;padding:6px 2px;}
  .round-col{display:flex;flex-direction:column;justify-content:space-around;min-width:230px;}
  .round-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--court);text-align:center;margin-bottom:8px;}
  .match{border:1px solid #D8C4EC;border-radius:5px;margin:10px 0;background:#FFFDFB;}
  .mrow{display:flex;align-items:center;gap:6px;padding:7px 8px;border-bottom:1px solid #EBDCF6;cursor:pointer;}
  .mrow:last-child{border-bottom:none;}
  .mrow:hover{background:#F3E9FB;}
  .mrow.winner{background:#E6F5EB;}
  .mrow.bye{color:#B49CCB;font-style:italic;cursor:default;}
  .mrow .seedno{font-size:10px;color:#B49CCB;width:16px;flex:none;}
  .mname{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mrow.winner .mname{color:var(--ok);}
  .mname-input{border:none;background:transparent;padding:2px;font-size:13px;width:100%;font-weight:600;}
  .checkmark{color:var(--ok);font-weight:800;margin-right:2px;flex:none;}
  .msets{display:flex;gap:3px;flex:none;}
  .msets input{width:26px;height:24px;text-align:center;padding:0;font-size:12.5px;border:1px solid #D8C4EC;border-radius:3px;background:#fff;}
  .msets input:disabled{background:#EFE6F7;border-color:#DDCBEE;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  .champion-banner{
    background:linear-gradient(135deg,var(--court),var(--clay));color:#fff;padding:16px 20px;border-radius:6px;
    display:flex;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap;gap:10px;
  }
  .champion-banner .title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);}
  .champion-banner .name{font-size:20px;font-weight:800;}
  .tourn-card-header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  .done-badge{background:var(--ok);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;text-transform:uppercase;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table th{text-align:left;padding:8px 8px;border-bottom:2px solid var(--court);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#5C4478;white-space:nowrap;}
  table td{padding:7px 8px;border-bottom:1px solid #EBDCF6;}
  table tr.top10{background:#F7ECFA;}
  table tr.rank-row{cursor:pointer;}
  table tr.rank-row:hover{background:#F4E9FA;}
  .rank-no{font-weight:800;color:var(--clay);width:30px;}
  .move-up{color:var(--ok);font-weight:700;font-size:12px;}
  .move-down{color:var(--danger);font-weight:700;font-size:12px;}
  .move-same{color:#B49CCB;font-size:12px;}
  .move-new{color:var(--clay);font-weight:800;font-size:10.5px;background:var(--paper-2);padding:2px 5px;border-radius:3px;}
  .search-bar{margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .search-bar input{max-width:260px;}
  .breakdown-row td{background:#F6ECFA;padding:10px 14px;}
  .breakdown-chip{display:inline-block;background:var(--paper-2);border-radius:4px;padding:3px 8px;margin:2px 4px 2px 0;font-size:12px;}
  .breakdown-chip b{color:var(--clay);}
  .grid-view{overflow-x:auto;}
  .grid-view table{font-size:12px;}
  .grid-view td, .grid-view th{padding:5px 6px;text-align:center;}
  .grid-view td:nth-child(2), .grid-view th:nth-child(2){text-align:left;position:sticky;left:0;background:#fff;}

  .pt-table th, .pt-table td{text-align:center;}
  .pt-table td:first-child, .pt-table th:first-child{text-align:left;}
  .pt-table input{width:64px;text-align:center;padding:4px;}

  .empty-state{text-align:center;padding:40px 20px;color:#8D7AA8;}
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .toast.show{opacity:1;}
  .rr-grid{display:grid;grid-template-columns:1fr 90px 90px;gap:8px;align-items:center;margin-bottom:8px;}
  .rr-grid.head{font-size:11px;font-weight:800;text-transform:uppercase;color:#5C4478;}
  .helptext{font-size:12px;color:#7C6A94;margin-top:6px;line-height:1.5;}
  .flag{margin-right:3px;}
  .ro-set{display:inline-flex;align-items:center;justify-content:center;width:26px;height:24px;font-size:12.5px;color:var(--ink);flex:none;}
  .archive-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:4px;cursor:pointer;}
  .archive-row:hover{background:var(--paper-2);}
  .archive-row + .archive-row{border-top:1px solid #EBDCF6;}
  .archive-detail{padding:12px 4px 6px;}
  .entry-textarea{width:100%;min-height:110px;padding:8px;border:1px solid #D3C0E8;border-radius:4px;font-size:12.5px;font-family:inherit;background:#FFFDFB;resize:vertical;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Tour <span>Manager</span></h1>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <button class="btn small secondary" onclick="exportSave()">Export Save</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importSave(event)">
      <button class="btn small secondary" onclick="document.getElementById('importFile').click()">Import Save</button>
      <div class="week-pill" id="weekPill">—</div>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="season" class="active">Season</button>
    <button data-tab="entrylists">Entry Lists</button>
    <button data-tab="draw">This Week</button>
    <button data-tab="results">Results</button>
    <button data-tab="rankings">Rankings</button>
    <button data-tab="points">Points Table</button>
  </nav>

  <section class="panel active" id="panel-season"></section>
  <section class="panel" id="panel-entrylists"></section>
  <section class="panel" id="panel-draw"></section>
  <section class="panel" id="panel-results"></section>
  <section class="panel" id="panel-rankings"></section>
  <section class="panel" id="panel-points"></section>
</div>
<div class="toast" id="toast"></div>

function flagEmoji(code){
  if(!code || code.length!==2) return '';
  return code.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt()));
}
function playerFlag(name){
  const p = findPlayer(name);
  const code = p ? p.country : (COUNTRY_MAP[name]||'');
  return code ? `<span class="flag">${flagEmoji(code)}</span>` : '';
}
function countryOptions(selected){
  const codes = Object.keys(COUNTRY_NAMES).sort((a,b)=>COUNTRY_NAMES[a].localeCompare(COUNTRY_NAMES[b]));
  let opts = `<option value="" ${!selected?'selected':''}>\u2014 unset \u2014</option>`;
  codes.forEach(c=>{
    opts += `<option value="${c}" ${selected===c?'selected':''}>${flagEmoji(c)} ${COUNTRY_NAMES[c]}</option>`;
  });
  return opts;
}

function suggestTemplateKey(category, drawSize){
  if(category==="GS") return "GS";
  if(category==="FINALS") return "FINALS";
  if(category==="1000") return drawSize>=80 ? "P1000_BIG" : "P1000_SML";
  if(category==="500") return drawSize>=29 ? "T500_BIG" : "T500_SML";

let STATE = null;

function weeksOrder(calendar){
  const order=[];
  calendar.forEach(e=>{ if(!order.includes(e.week)) order.push(e.week); });
  return order;
}

function defaultState(){
  const calendar = SEED_CALENDAR.map(e=>({...e}));
  const order = weeksOrder(calendar);
  const curEvt = calendar.find(e=>e.status==="current");
  const curWeekVal = curEvt ? curEvt.week : order[0];
  const players = SEED_PLAYERS.map(p=>({...p, pts:[...p.pts], country: COUNTRY_MAP[p.name] || ''}));

  // Expire the starting week's slot for everyone (nobody has "defended" it yet this cycle).
  const slot = weekLabelToSlotIndexFor(WEEK_LABELS, curWeekVal);
  players.forEach(p=>{ p.pts[slot] = 0; });
  players.forEach(p=>{ p.total = p.pts.reduce((a,b)=>a+(b||0),0); });
  players.sort((a,b)=>b.total-a.total);
  const snap = {};
  players.forEach(p=>{ snap[p.name] = p.total; });

  return {
    weekLabels: WEEK_LABELS,
    players,
    calendar,
    currentWeekIdx: order.indexOf(curWeekVal),
    activeDraws: {},
    archivedDraws: {},
    qualifying: {},
    weeklySnapshots: { [curWeekVal]: snap },
    templates: JSON.parse(JSON.stringify(DEFAULT_TEMPLATES))
  };
}

const STORAGE_KEY = 'wta-tour-state-v3';
const hasClaudeStorage = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';

async function loadState(){
  try{
    if(hasClaudeStorage){
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){ STATE = JSON.parse(res.value); return; }
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ STATE = JSON.parse(raw); return; }
    }
  }catch(e){}
  STATE = defaultState();
  await saveState();
}
async function saveState(){
  try{
    if(hasClaudeStorage){
      await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false);
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    }
  }catch(e){ console.error('save failed', e); }
}
function exportSave(){
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const wv = currentWeekVal();
  a.href = url;
  a.download = `wta-tour-save-week${wv!=null?wv:'end'}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Save file downloaded.');
}
function importSave(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.calendar || !parsed.players){ toast("That file doesn't look like a valid save."); return; }
      STATE = parsed;
      if(!STATE.archivedDraws) STATE.archivedDraws = {};
      if(!STATE.activeDraws) STATE.activeDraws = {};
      if(!STATE.qualifying) STATE.qualifying = {};
      if(!STATE.weeklySnapshots || Object.keys(STATE.weeklySnapshots).length===0){
        STATE.weeklySnapshots = {};
        captureSnapshotForWeek(currentWeekVal());
      }
      await saveState();
      renderAll();
      toast('Save imported.');
    }catch(e){
      toast('Could not read that file.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._h);
  toast._h=setTimeout(()=>t.classList.remove('show'),2200);
}

document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('section.panel').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('panel-'+b.dataset.tab).classList.add('active');
  });
});

function findPlayer(name){
  name=(name||'').trim();
  if(!name) return null;
  return STATE.players.find(p=>p.name.toLowerCase()===name.toLowerCase());
}
function ensurePlayer(name){
  let p = findPlayer(name);
  if(!p){
    p = {name:name.trim(), total:0, pts: STATE.weekLabels.map(()=>0), country: COUNTRY_MAP[name.trim()] || ''};
    STATE.players.push(p);
  }
  return p;
}
function catLabel(c){
  return {GS:"Grand Slam", "1000":"Premier 1000","500":"WTA 500","250":"WTA 250",FINALS:"WTA Finals",BYE:"Bye Week"}[c] || c;
}
function currentWeekVal(){
  const order = weeksOrder(STATE.calendar);
  return order[STATE.currentWeekIdx];
}
function currentWeekEvents(){
  const wv = currentWeekVal();
  return STATE.calendar.map((e,i)=>({e,i})).filter(x=>x.e.week===wv);
}
function weekLabelToSlotIndexFor(labels, week){
  const idx = labels.findIndex(l=>{
    if(l===week) return true;
    if(typeof l==='string' && l.includes('/')){
      return l.split('/').map(x=>parseInt(x)).includes(parseInt(week));
    }
    return false;
  });
  return idx>=0?idx:0;
}
function weekLabelToSlotIndex(week){
  return weekLabelToSlotIndexFor(STATE.weekLabels, week);
}

// ================= ENTRY LIST / QUALIFYING (manual) =================
function fieldDefaults(category, drawSize){
  if(category==='GS') return {wildcards:8, qualifyingSpots:16, qualifyingRounds:3, numSeeds:32};
  if(category==='1000') return drawSize>=80
    ? {wildcards:8, qualifyingSpots:12, qualifyingRounds:2, numSeeds:32}
    : {wildcards:4, qualifyingSpots:8,  qualifyingRounds:2, numSeeds:16};
  if(category==='500') return {wildcards:4, qualifyingSpots:4, qualifyingRounds:2, numSeeds:8};
  if(category==='250') return {wildcards:3, qualifyingSpots:4, qualifyingRounds:2, numSeeds:8};
  return {wildcards:2, qualifyingSpots:2, qualifyingRounds:2, numSeeds:4};
}
function ensureEntryFields(ev){
  if(ev.wildcards==null){
    const d = fieldDefaults(ev.category, ev.drawSize);
    ev.wildcards = d.wildcards;
    ev.qualifyingSpots = d.qualifyingSpots;
    ev.qualifyingRounds = d.qualifyingRounds;
    ev.numSeeds = d.numSeeds;
  }
}
function autoSortEntryList(idx){
  const ev = STATE.calendar[idx];
  const wildcards = parseInt(document.getElementById('wcCount-'+idx).value) || 0;
  const qualifyingSpots = parseInt(document.getElementById('qSpots-'+idx).value) || 0;
  const qualifyingRounds = parseInt(document.getElementById('qRounds-'+idx).value) || 2;
  const rankingWeek = Number(document.getElementById('elRankWeek-'+idx).value);
  const raw = document.getElementById('allEntrantsList-'+idx).value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(raw.length===0){ toast('Paste in the full entrant list first.'); return; }

  const uniqueNames = [...new Set(raw)];
  const sorted = uniqueNames.sort((a,b)=>rankInSnapshot(b,rankingWeek)-rankInSnapshot(a,rankingWeek));

  const directSpots = Math.max(0, ev.drawSize - wildcards - qualifyingSpots);
  const groupSize = Math.pow(2, qualifyingRounds);
  const qualPoolSize = qualifyingSpots * groupSize;

  const direct = sorted.slice(0, directSpots);
  const qualifyingPool = sorted.slice(directSpots, directSpots + qualPoolSize);
  const alternates = sorted.slice(directSpots + qualPoolSize, directSpots + qualPoolSize + 8);

  document.getElementById('directList-'+idx).value = direct.join('\n');
  document.getElementById('qualList-'+idx).value = qualifyingPool.join('\n');
  document.getElementById('altList-'+idx).value = alternates.join('\n');
  toast(`Sorted ${sorted.length} entrants by ${weekOptionLabel(rankingWeek)} rankings: ${direct.length} into the main draw, ${qualifyingPool.length} into qualifying${alternates.length ? `, ${alternates.length} alternates` : ''}. Review below, then Save.`);
}
function saveEntryList(idx){
  const ev = STATE.calendar[idx];
  const wildcards = parseInt(document.getElementById('wcCount-'+idx).value) || 0;
  const qualifyingSpots = parseInt(document.getElementById('qSpots-'+idx).value) || 0;
  const qualifyingRounds = parseInt(document.getElementById('qRounds-'+idx).value) || 2;
  const numSeeds = parseInt(document.getElementById('numSeedsField-'+idx).value) || 8;
  const rankingWeek = Number(document.getElementById('elRankWeek-'+idx).value);
  const parseLines = id => document.getElementById(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
  const direct = parseLines('directList-'+idx);
  const wildcardNames = parseLines('wcList-'+idx);
  const qualifyingPool = parseLines('qualList-'+idx);
  const alternates = parseLines('altList-'+idx);

  ev.wildcards = wildcards;
  ev.qualifyingSpots = qualifyingSpots;
  ev.qualifyingRounds = qualifyingRounds;
  ev.numSeeds = numSeeds;
  ev.entryList = { generatedAtWeek: currentWeekVal(), rankingWeek, direct, wildcardNames, qualifyingPool, alternates };
  saveState();
  renderAll();
  toast(`Entry list saved for ${ev.name}.`);
}
function clearEntryList(idx){
  const ev = STATE.calendar[idx];
  delete ev.entryList;
  saveState();
  renderAll();
}

function renderSeason(){
  const el = document.getElementById('panel-season');
  let html = '<div class="card"><h2>2011 Season</h2><p class="muted">Weeks post in order. A week can hold more than one tournament — finish every event in the highlighted week to unlock the next.</p></div>';
  let lastMonth = null;
  const wv = currentWeekVal();
  let curWeekOpen = false;
  STATE.calendar.forEach((ev, idx)=>{
    const month = ev.date.split(' ')[0];
    if(month!==lastMonth){
      if(curWeekOpen){ html += '</div>'; curWeekOpen=false; }
      html += `<div class="month-label">${month}</div>`; lastMonth=month;
    }
    const isCurWeek = ev.week===wv;
    const prevWv = idx>0 ? STATE.calendar[idx-1].week : null;
    if(ev.week!==prevWv){
      if(curWeekOpen){ html += '</div>'; }
      html += `<div class="week-block ${isCurWeek?'current-week':''}">`;
      curWeekOpen = true;
    }
    let resultText = '';
    if(ev.status==='completed' && ev.result && ev.result.champion){
      resultText = `\ud83c\udfc6 ${ev.result.champion} d. ${ev.result.runnerup}`;
    } else if(ev.category==='BYE'){
      resultText = 'No tour event';
    }
    const catBadge = ev.category==='BYE' ? '' : `<span class="ev-cat">${catLabel(ev.category)}${ev.drawSize?(' \u00b7 S'+ev.drawSize):''}</span>`;
    html += `<div class="event-row ${ev.status}">
      <div class="status-dot ${ev.status}"></div>
      <div class="ev-week">Wk ${ev.week}</div>
      <div class="ev-name">${ev.name}</div>
      <div class="ev-city">${ev.city}</div>
      ${catBadge}
      <div class="ev-result">${resultText}</div>
    </div>`;
  });
  if(curWeekOpen) html += '</div>';
  if(wv!=null){
    html += `<button class="btn" onclick="document.querySelector('nav.tabs button[data-tab=draw]').click()">Go to This Week</button>`;
  }
  el.innerHTML = html;
}

async function skipByeWeek(){
  currentWeekEvents().forEach(({e})=>{ e.status='completed'; });
  advanceWeekIfDone();
  await saveState();
  renderAll();
  toast('Moved past bye week.');
}

function expireWeekPoints(weekVal){
  const slot = weekLabelToSlotIndex(weekVal);
  STATE.players.forEach(p=>{ p.pts[slot] = 0; });
  STATE.players.forEach(p=>{ p.total = p.pts.reduce((a,b)=>a+(b||0),0); });
  STATE.players.sort((a,b)=>b.total-a.total);
}
function captureSnapshotForWeek(weekVal){
  if(!STATE.weeklySnapshots) STATE.weeklySnapshots = {};
  const snap = {};
  STATE.players.forEach(p=>{ snap[p.name] = p.total; });
  STATE.weeklySnapshots[weekVal] = snap;
}
// Returns the archived snapshot for a given week, falling back to the closest earlier
// archived week if that exact week was never captured, and finally to live totals.
function getSnapshotForWeek(weekVal){
  if(!STATE.weeklySnapshots) STATE.weeklySnapshots = {};
  if(STATE.weeklySnapshots[weekVal]) return STATE.weeklySnapshots[weekVal];
  const order = weeksOrder(STATE.calendar);
  const pos = order.indexOf(weekVal);
  if(pos>=0){
    for(let i=pos-1;i>=0;i--){
      if(STATE.weeklySnapshots[order[i]]) return STATE.weeklySnapshots[order[i]];
    }
  }
  const snap = {};
  STATE.players.forEach(p=>{ snap[p.name] = p.total; });
  return snap;
}
function availableSnapshotWeeks(){
  if(!STATE.weeklySnapshots) return [];
  const order = weeksOrder(STATE.calendar);
  return Object.keys(STATE.weeklySnapshots).map(Number).sort((a,b)=> order.indexOf(a)-order.indexOf(b));
}
function weekOptionLabel(weekVal){
  const ev = STATE.calendar.find(e=>e.week===weekVal);
  return ev ? `Week ${weekVal} \u2014 ${ev.name}` : `Week ${weekVal}`;
}
function weekSelectOptions(selectedWeek){
  const weeks = availableSnapshotWeeks();
  return weeks.map(w=>`<option value="${w}" ${w===selectedWeek?'selected':''}>${weekOptionLabel(w)}</option>`).join('');
}
function rankInSnapshot(name, weekVal){
  const snap = getSnapshotForWeek(weekVal);
  if(Object.prototype.hasOwnProperty.call(snap, name)) return snap[name];
  return 0; // player didn't exist / wasn't ranked as of that week
}
function snapshotRank(name){
  return rankInSnapshot(name, currentWeekVal());
}

function advanceWeekIfDone(){
  const events = currentWeekEvents().map(x=>x.e);
  const pending = events.filter(e=>e.category!=='BYE' && e.status!=='completed');
  if(pending.length>0) return false;
  const order = weeksOrder(STATE.calendar);
  let n = STATE.currentWeekIdx+1;
  if(n < order.length){
    STATE.currentWeekIdx = n;
    const nv = order[n];
    STATE.calendar.forEach(e=>{ if(e.week===nv) e.status='current'; });
    expireWeekPoints(nv);
    captureSnapshotForWeek(nv);
  } else {
    STATE.currentWeekIdx = order.length;
  }
  return true;
}

function nextPow2(n){let p=1;while(p<n)p*=2;return p;}
function seedOrder(n){
  let seeds=[1,2];
  while(seeds.length<n){
    const s2=seeds.length*2;
    const ns=[];
    for(const s of seeds){ ns.push(s); ns.push(s2+1-s); }
    seeds=ns;
  }
  return seeds;
}
function roundLabels(numRounds){
  const namesFromFinal = ['Final','Semifinal','Quarterfinal','Round of 16','Round of 32','Round of 64','Round of 128'];
  const labels=[];
  for(let i=0;i<numRounds;i++){
    const distFromFinal = numRounds-1-i;
    labels.push(namesFromFinal[distFromFinal] || ('Round '+(i+1)));
  }
  return labels;
}
const ROUND_KEY_FROM_FINAL = ['F','SF','QF','R16','R32','R64','R128'];

}

  renderTournamentCard(idx);
}

function renderReadonlyBracket(draw){
  let cols = '';
  draw.rounds.forEach(round=>{
    let matches = '';
    round.matches.forEach(m=>{
      ensureSets(m);
      const row = (p, key) => {
        if(!p) return `<div class="mrow"><span class="seedno"></span><span class="mname">TBD</span></div>`;
        if(p.isBye) return `<div class="mrow bye"><span class="seedno"></span><span class="mname">BYE</span></div>`;
        const isWinner = m.winner && m.winner.name===p.name && m.winner.seed===p.seed;
        const seedTag = p.seed?('#'+p.seed):'';
        const setsHtml = m.sets.map(s=> `<span class="ro-set">${s[key]!==''&&s[key]!=null ? s[key] : '\u2013'}</span>`).join('');
        return `<div class="mrow ${isWinner?'winner':''}">
          <span class="seedno">${seedTag}</span>${playerFlag(p.name)}<span class="mname">${p.name||'TBD'}</span>
          ${isWinner?'<span class="checkmark">\u2713</span>':''}
          <div class="msets">${setsHtml}</div>
        </div>`;
      };
      matches += `<div class="match">${row(m.p1,'p1')}${row(m.p2,'p2')}</div>`;
    });
    cols += `<div class="round-col"><div class="round-title">${round.label}</div>${matches}</div>`;
  });
  return `<div class="bracket-wrap"><div class="bracket">${cols}</div></div>`;
}

function renderReadonlyRR(draw){
  const rows = draw.players.map(p=>{
    const tag = p.name===draw.champion ? ' \ud83c\udfc6 Champion' : (p.name===draw.runnerup ? ' Runner-up' : '');
    return `<div class="rr-grid"><div>${playerFlag(p.name)}${p.name}${tag}</div><div>${p.wins} win${p.wins===1?'':'s'}</div><div></div></div>`;
  }).join('');

    const expanded = expandedArchive.has(idx);
    host.innerHTML = `<div class="card">

      ${draw ? `<button class="btn secondary small" onclick="toggleThisWeekArchive(${idx})">${expanded?'Hide':'View'} Bracket &amp; Scores</button>` : ''}

function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
// Standard tennis seeding tiers: seed 1 and 2 anchor the draw; 3-4 anchor quarters;
// 5-8 anchor eighths; etc. Real draws randomly assign WHICH player in a tier lands in
// WHICH of that tier's structural slots — the slot set itself is fixed, the pairing isn't.
const SEED_POTS = [[1,1],[2,2],[3,4],[5,8],[9,16],[17,32],[33,64],[65,128]];

function buildBracketRounds(drawSize, seedNames, fillPool){
  fillPool = fillPool ? shuffleArray(fillPool) : [];
  const slots = nextPow2(drawSize);
  const byes = slots - drawSize;
  const order = seedOrder(slots);
  const numSeeds = seedNames.length;

  const positions = new Array(slots).fill(null);
  SEED_POTS.forEach(([lo,hi])=>{
    if(lo>numSeeds) return;
    const potHi = Math.min(hi, numSeeds);
    const ranks = [];
    for(let r=lo;r<=potHi;r++) ranks.push(r);
    if(ranks.length===0) return;
    const potPositions = [];
    for(let pos=0; pos<slots; pos++){
      if(order[pos]>=lo && order[pos]<=potHi) potPositions.push(pos);
    }
    const shuffledRanks = shuffleArray(ranks);
    potPositions.forEach((pos, i)=>{
      const r = shuffledRanks[i];
      positions[pos] = {name: seedNames[r-1] || ('Seed '+r), seed:r, isBye:false};
    });
  });
  const byeRanks = new Set();
  for(let r=1;r<=byes;r++) byeRanks.add(r);
  for(let i=0;i<slots;i+=2){
    const a=positions[i], b=positions[i+1];
    if(a && byeRanks.has(a.seed) && !b){ positions[i+1] = {name:'BYE', seed:null, isBye:true}; }
    if(b && byeRanks.has(b.seed) && !a){ positions[i] = {name:'BYE', seed:null, isBye:true}; }
  }
  for(let i=0;i<slots;i++){
    if(!positions[i]){
      const nm = fillPool.length ? fillPool.shift() : '';
      positions[i] = {name: nm, seed:null, isBye:false};
    }
  }

  const numRounds = Math.log2(slots);
  const labels = roundLabels(numRounds);

  const rounds = [];
  let current = positions;
  for(let rIdx=0; rIdx<numRounds; rIdx++){
    const matches=[];
    for(let i=0;i<current.length;i+=2){
      matches.push({p1:current[i], p2:current[i+1], winner:null, sets:[{p1:'',p2:''},{p1:'',p2:''},{p1:'',p2:''}]});
    }
    rounds.push({label:labels[rIdx], matches});
    current = matches.map(()=>null);
  }

  rounds[0].matches.forEach(m=>{
    if(m.p1 && m.p1.isBye && m.p2) m.winner = m.p2;
    if(m.p2 && m.p2.isBye && m.p1) m.winner = m.p1;
  });
  propagateWinners(rounds);
  return rounds;
}

function generateDraw(idx){
  const ev = STATE.calendar[idx];
  ensureEntryFields(ev);
  if(!ev.entryList){ toast('Set an entry list for this tournament first (Entry Lists tab).'); return; }

  const drawSize = parseInt(document.getElementById('drawSizeInput-'+idx).value);
  const numSeeds = parseInt(document.getElementById('numSeedsInput-'+idx).value);
  const tplKey = document.getElementById('tplSelect-'+idx).value;
  const seedNames = [];
  for(let i=1;i<=numSeeds;i++){
    seedNames.push(document.getElementById('seed'+idx+'-'+i).value.trim() || ('Seed '+i));
  }

  const seedingWeek = ev.seedingWeek!=null ? ev.seedingWeek : currentWeekVal();
  const directSorted = [...ev.entryList.direct].sort((a,b)=>rankInSnapshot(b,seedingWeek)-rankInSnapshot(a,seedingWeek));
  const usedAsSeed = new Set(seedNames);
  const remainingDirect = directSorted.filter(n=>!usedAsSeed.has(n));
  const namedWc = (ev.entryList.wildcardNames || []).slice(0, ev.wildcards);
  const wcNames = Array.from({length: ev.wildcards}, (_,i)=> namedWc[i] || `Wildcard ${i+1}`);
  const qual = STATE.qualifying[idx];
  const qNames = (qual && qual.complete) ? qual.qualifiers.slice()
    : Array.from({length: ev.qualifyingSpots}, (_,i)=> `Qualifier ${i+1}`);
  const fillPool = [...remainingDirect, ...wcNames, ...qNames];

  const rounds = buildBracketRounds(drawSize, seedNames, fillPool);
  STATE.activeDraws[idx] = {drawSize, tplKey, rounds, complete:false};
  saveState();
  renderAll();
}

function generateQualifying(idx){
  const ev = STATE.calendar[idx];
  ensureEntryFields(ev);
  if(!ev.entryList){ toast('Set an entry list for this tournament first (Entry Lists tab).'); return; }
  const pool = shuffleArray(ev.entryList.qualifyingPool);
  const groupSize = Math.pow(2, ev.qualifyingRounds);
  const groups = [];
  for(let g=0; g<ev.qualifyingSpots; g++){
    const chunk = pool.splice(0, groupSize);
    const rounds = buildBracketRounds(groupSize, [], chunk);
    groups.push({rounds, complete:false});
  }
  STATE.qualifying[idx] = {groups, complete:false, qualifiers:[]};
  saveState();
  renderAll();
}

function checkQualifyingComplete(idx){
  const qual = STATE.qualifying[idx];
  if(!qual || qual.complete) return;
  const allDone = qual.groups.every(g=>g.complete);
  if(!allDone) return;
  qual.complete = true;
  const ev = STATE.calendar[idx];
  const weekSlot = weekLabelToSlotIndex(ev.week);
  const tpl = STATE.templates[suggestTemplateKey(ev.category, ev.drawSize)];
  qual.qualifiers = qual.groups.map(g=>{
    const finalMatch = g.rounds[g.rounds.length-1].matches[0];
    const champ = finalMatch.winner;
    const runnerup = (finalMatch.p1 && champ && finalMatch.p1.name===champ.name && finalMatch.p1.seed===champ.seed) ? finalMatch.p2 : finalMatch.p1;
    if(champ && champ.name) ensurePlayer(champ.name).pts[weekSlot] = tpl.Q || 0;
    if(runnerup && runnerup.name && !runnerup.isBye) ensurePlayer(runnerup.name).pts[weekSlot] = tpl.Q1 || 0;
    return champ ? champ.name : 'Qualifier';
  });
  STATE.players.forEach(p=>{ p.total = p.pts.reduce((a,b)=>a+(b||0),0); });
  STATE.players.sort((a,b)=>b.total-a.total);
  toast('Qualifying complete — qualifiers are set.');
}

function qualSetWinner(idx, groupIdx, roundIdx, matchIdx, slotKey){
  const draw = STATE.qualifying[idx].groups[groupIdx];
  const m = draw.rounds[roundIdx].matches[matchIdx];
  const player = slotKey==='p1'?m.p1:m.p2;
  if(!player || !player.name || player.isBye) return;
  m.winner = player;
  propagateWinners(draw.rounds);
  const lastRound = draw.rounds[draw.rounds.length-1];
  draw.complete = !!lastRound.matches[0].winner;
  checkQualifyingComplete(idx);
  saveState();
  renderAll();
}

function qualUpdateSetScore(idx, groupIdx, roundIdx, matchIdx, setIdx, key, value){
  const draw = STATE.qualifying[idx].groups[groupIdx];
  const m = draw.rounds[roundIdx].matches[matchIdx];
  ensureSets(m);
  m.sets[setIdx][key] = value;
  const outcome = computeSetsWinner(m.sets);
  if(outcome && m.p1 && m.p2 && !m.p1.isBye && !m.p2.isBye && m.p1.name && m.p2.name){
    m.winner = outcome==='p1' ? m.p1 : m.p2;
  } else {
    m.winner = null;
  }
  propagateWinners(draw.rounds);
  const lastRound = draw.rounds[draw.rounds.length-1];
  draw.complete = !!lastRound.matches[0].winner;
  checkQualifyingComplete(idx);
  saveState();
  renderAll();
}

function qualUpdateSlotName(idx, groupIdx, roundIdx, matchIdx, slotKey, value){
  const draw = STATE.qualifying[idx].groups[groupIdx];
  const m = draw.rounds[roundIdx].matches[matchIdx];
  if(slotKey==='p1'){ if(!m.p1) m.p1={name:'',seed:null,isBye:false}; m.p1.name=value; }
  else { if(!m.p2) m.p2={name:'',seed:null,isBye:false}; m.p2.name=value; }

}

function propagateWinners(rounds){
  for(let r=0;r<rounds.length-1;r++){
    const thisRound = rounds[r].matches;
    const nextRound = rounds[r+1].matches;
    for(let i=0;i<thisRound.length;i++){
      const winner = thisRound[i].winner;
      const nextMatchIdx = Math.floor(i/2);
      const slotKey = (i%2===0)?'p1':'p2';
      nextRound[nextMatchIdx][slotKey] = winner ? {name:winner.name, seed:winner.seed, isBye:false} : null;
    }
  }
}

function setWinner(idx, roundIdx, matchIdx, slotKey){

  const player = slotKey==='p1'?m.p1:m.p2;
  if(!player || !player.name || player.isBye) return;
  m.winner = player;
  propagateWinners(draw.rounds);
  const lastRound = draw.rounds[draw.rounds.length-1];

  renderTournamentCard(idx);
}

function updateSlotName(idx, roundIdx, matchIdx, slotKey, value){

  else { if(!m.p2) m.p2={name:'',seed:null,isBye:false}; m.p2.name=value; }
  saveState();
}

function parseSetsWinner(scoreStr){
  if(!scoreStr) return null;
  const clean = scoreStr.replace(/\([^)]*\)/g, ''); // strip tiebreak point counts, e.g. 7-6(4)
  const setTokens = clean.split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  let p1sets=0, p2sets=0, any=false;
  setTokens.forEach(tok=>{
    const m = tok.match(/(\d+)\s*-\s*(\d+)/);
    if(!m) return;
    any = true;
    const a=parseInt(m[1]), b=parseInt(m[2]);
    if(a>b) p1sets++; else if(b>a) p2sets++;
  });
  if(!any) return null;
  if(p1sets>p2sets) return 'p1';
  if(p2sets>p1sets) return 'p2';
  return null;
}

function ensureSets(m){
  if(!m.sets) m.sets = [{p1:'',p2:''},{p1:'',p2:''},{p1:'',p2:''}];
}

function computeSetsWinner(sets){
  let p1sets=0, p2sets=0;
  sets.forEach(s=>{
    const a = s.p1===''||s.p1==null ? null : parseInt(s.p1);
    const b = s.p2===''||s.p2==null ? null : parseInt(s.p2);
    if(a==null || b==null || isNaN(a) || isNaN(b)) return;
    if(a>b) p1sets++; else if(b>a) p2sets++;
  });
  if(p1sets>=2) return 'p1';
  if(p2sets>=2) return 'p2';
  return null;
}

function updateSetScore(idx, roundIdx, matchIdx, setIdx, key, value){
  const draw = STATE.activeDraws[idx];
  const m = draw.rounds[roundIdx].matches[matchIdx];
  ensureSets(m);
  m.sets[setIdx][key] = value;
  const outcome = computeSetsWinner(m.sets);
  if(outcome && m.p1 && m.p2 && !m.p1.isBye && !m.p2.isBye && m.p1.name && m.p2.name){
    m.winner = outcome==='p1' ? m.p1 : m.p2;
  } else {
    m.winner = null;
  }
  propagateWinners(draw.rounds);
  const lastRound = draw.rounds[draw.rounds.length-1];
  draw.complete = !!lastRound.matches[0].winner;
  saveState();
  renderTournamentCard(idx);
}

async function applyResults(idx){
  const ev = STATE.calendar[idx];
  const draw = STATE.activeDraws[idx];
  const tpl = STATE.templates[draw.tplKey];
  const weekSlot = weekLabelToSlotIndex(ev.week);

  const numRounds = draw.rounds.length;
  const champion = draw.rounds[numRounds-1].matches[0].winner;
  if(champion){ ensurePlayer(champion.name).pts[weekSlot] = tpl.W || 0; }

  for(let r=numRounds-1; r>=0; r--){
    const key = ROUND_KEY_FROM_FINAL[numRounds-1-r];
    draw.rounds[r].matches.forEach(m=>{
      if(!m.winner) return;
      const loser = (m.p1 && m.winner.name===m.p1.name && m.winner.seed===m.p1.seed) ? m.p2 : m.p1;
      if(loser && !loser.isBye && loser.name){
        const pts = tpl[key];
        if(pts!=null) ensurePlayer(loser.name).pts[weekSlot] = pts;
      }
    });
  }

  STATE.players.forEach(p=>{ p.total = p.pts.reduce((a,b)=>a+(b||0),0); });
  STATE.players.sort((a,b)=>b.total-a.total);

  const finalM = draw.rounds[numRounds-1].matches[0];
  const runnerup = (finalM.p1 && finalM.winner.name===finalM.p1.name) ? finalM.p2 : finalM.p1;
  const sfLosers = numRounds>=2 ? draw.rounds[numRounds-2].matches.map(m=>{
    const l = (m.p1 && m.winner && m.winner.name===m.p1.name)? m.p2 : m.p1;
    return l ? l.name : null;
  }).filter(Boolean) : [];
  ev.result = {champion: champion?champion.name:'', runnerup: runnerup?runnerup.name:'', sf: sfLosers, qf: []};
  ev.status = 'completed';
  STATE.archivedDraws[idx] = draw;
  delete STATE.activeDraws[idx];

  const weekDone = advanceWeekIfDone();
  await saveState();
  renderAll();
  toast(weekDone ? `${ev.name} complete — week finished, rankings updated.` : `${ev.name} complete — rankings updated.`);
  if(weekDone) document.querySelector('nav.tabs button[data-tab="season"]').click();
}

async function finishFinals(idx){
  const ev = STATE.calendar[idx];
  const draw = STATE.activeDraws[idx];
  const tpl = STATE.templates[draw.tplKey];

function computeSnapshotPositions(weekVal){
  const snap = getSnapshotForWeek(weekVal!=null ? weekVal : currentWeekVal());
  const sortedSnapNames = Object.keys(snap).sort((a,b)=> snap[b]-snap[a]);
  const posMap = {};
  sortedSnapNames.forEach((name,i)=>{ posMap[name] = i+1; });
  return posMap;
}
function movementBadge(name, currentRank, posMap){
  if(!Object.prototype.hasOwnProperty.call(posMap, name)){
    return '<span class="move-new">NEW</span>';
  }
  const prev = posMap[name];
  const delta = prev - currentRank;
  if(delta>0) return `<span class="move-up">\u25b2${delta}</span>`;
  if(delta<0) return `<span class="move-down">\u25bc${Math.abs(delta)}</span>`;
  return '<span class="move-same">\u2014</span>';
}
function fillRankingsTable(filter){
  const wrap = document.getElementById('rankTableWrap');
  const sorted = [...STATE.players].sort((a,b)=>b.total-a.total);
  const posMap = computeSnapshotPositions(compareWeek);
  const f = filter.toLowerCase();
  const filtered = sorted.filter(p=>p.name.toLowerCase().includes(f));

  if(rankViewMode==='grid'){
    const headCols = STATE.weekLabels.map(l=>`<th>Wk ${l}</th>`).join('');
    const bodyRows = filtered.map(p=>{
      const rank = sorted.indexOf(p)+1;
      const cells = p.pts.map(v=>`<td>${v?v:'\u2013'}</td>`).join('');
      return `<tr class="${rank<=10?'top10':''}"><td class="rank-no">${rank}</td><td>${movementBadge(p.name,rank,posMap)}</td><td>${flagEmoji(p.country)} ${p.name}</td><td><b>${p.total}</b></td>${cells}</tr>`;
    }).join('');
    wrap.innerHTML = `<div class="grid-view"><table><thead><tr><th>#</th><th></th><th>Player</th><th>Total</th>${headCols}</tr></thead>
      <tbody>${bodyRows}</tbody></table></div>`;
    return;
  }

  const rows = filtered.map(p=>{
    const rank = sorted.indexOf(p)+1;
    let rowHtml = `<tr class="rank-row ${rank<=10?'top10':''}" onclick="toggleBreakdown('${p.name.replace(/'/g,"\\'")}')">
      <td class="rank-no">${rank}</td><td>${movementBadge(p.name,rank,posMap)}</td><td>${flagEmoji(p.country)} ${p.name}</td><td>${p.total.toLocaleString()}</td></tr>`;
    if(expandedPlayer===p.name){
      const chips = p.pts.map((v,i)=> v ? `<span class="breakdown-chip">Wk ${STATE.weekLabels[i]}: <b>${v}</b></span>` : '').join('');
      rowHtml += `<tr class="breakdown-row"><td></td><td></td><td colspan="2">
        <div style="margin-bottom:8px"><label style="display:inline-block;margin-right:8px">Nationality</label>
          <select style="width:auto;display:inline-block" onclick="event.stopPropagation()" onchange="event.stopPropagation();updateCountry('${p.name.replace(/'/g,"\\'")}',this.value)">${countryOptions(p.country)}</select>
        </div>
        ${chips || '<span class="muted">No points yet this cycle.</span>'}</td></tr>`;
    }
    return rowHtml;
  }).join('');
  wrap.innerHTML = `<table><thead><tr><th>#</th><th>Player</th><th>Points</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function toggleBreakdown(name){
  expandedPlayer = (expandedPlayer===name) ? null : name;
  fillRankingsTable(document.getElementById('rankSearch').value);
}

const PT_ROUNDS = ['W','F','SF','QF','R16','R32','R64','R128','Q','Q1'];
function renderPoints(){
  const el = document.getElementById('panel-points');
  let rows='';
  Object.entries(STATE.templates).forEach(([key,tpl])=>{
    rows += `<tr><td>${tpl.label}</td>${PT_ROUNDS.map(c=>{
      const v = tpl[c];
      return `<td>${v===undefined?'':`<input type="number" value="${v===null?'':v}" onchange="updatePts('${key}','${c}',this.value)">`}</td>`;
    }).join('')}</tr>`;
  });
  el.innerHTML = `<div class="card">
    <h2>Points Templates</h2>
    <p class="muted">These values drive every calculation. Edit any cell — changes apply the next time you complete a draw. Round-robin template (WTA Finals) uses its own columns.</p>
    <div style="overflow-x:auto"><table class="pt-table"><thead><tr><th>Category</th>${PT_ROUNDS.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody></table></div>
  </div>`;
}
function updatePts(key, col, val){
  STATE.templates[key][col] = val===''?null:parseInt(val);
  saveState();
}

let expandedEntry = null;
function toggleEntryEditor(idx){
  expandedEntry = (expandedEntry===idx) ? null : idx;
  renderEntryLists();
}

function renderEntryLists(){
  const el = document.getElementById('panel-entrylists');
  const events = STATE.calendar.map((e,i)=>({e,i})).filter(x=>x.e.category!=='BYE' && x.e.category!=='FINALS');

  let lastMonth = null;
  let rows = '';
  events.forEach(({e,i})=>{
    const month = e.date.split(' ')[0];
    if(month!==lastMonth){ rows += `<div class="month-label">${month}</div>`; lastMonth=month; }
    const hasList = !!e.entryList;
    rows += `<div class="archive-row" onclick="toggleEntryEditor(${i})">
      <div class="ev-week">Wk ${e.week}</div>
      <div class="ev-name">${e.name}</div>
      <div class="ev-city">${e.city}</div>
      <span class="ev-cat">${catLabel(e.category)}${e.drawSize?(' \u00b7 S'+e.drawSize):''}</span>
      <div class="ev-result">${hasList ? `\u2713 Entry list set (${e.entryList.direct.length} direct, ${e.entryList.qualifyingPool.length} in Q)` : '<span class="muted">Not set yet</span>'}</div>
    </div>`;
    if(expandedEntry===i){
      ensureEntryFields(e);
      const el2 = e.entryList || {direct:[],qualifyingPool:[],alternates:[]};
      rows += `<div class="archive-detail">
        <div class="grid3">
          <div class="field"><label>Wildcards</label><input type="number" id="wcCount-${i}" value="${e.wildcards}" min="0" max="16"></div>
          <div class="field"><label>Qualifying spots</label><input type="number" id="qSpots-${i}" value="${e.qualifyingSpots}" min="0" max="32"></div>
          <div class="field"><label>Qualifying rounds</label><input type="number" id="qRounds-${i}" value="${e.qualifyingRounds}" min="1" max="4"></div>
        </div>
        <div class="field"><label>Number of seeds (for the main draw)</label><input type="number" id="numSeedsField-${i}" value="${e.numSeeds}" min="0" max="32" style="max-width:120px"></div>
        <div class="field"><label>Ranking week to sort by</label>
          <select id="elRankWeek-${i}" style="max-width:280px">${weekSelectOptions(el2.rankingWeek!=null ? el2.rankingWeek : currentWeekVal())}</select>
          <div class="helptext" style="margin-top:4px">This only controls the "Auto-Sort" button below — pick whichever week's rankings should decide who's directly in vs. who's qualifying.</div>
        </div>
        <div class="field"><label>All entrants (optional) — paste the full field here, one player per line, and let the app sort them</label>
          <textarea class="entry-textarea" id="allEntrantsList-${i}" placeholder="Paste every player who entered — the app will rank them and fill in Direct/Qualifying/Alternates below"></textarea>
          <button class="btn secondary small" style="margin-top:6px" onclick="event.stopPropagation();autoSortEntryList(${i})">Auto-Sort by Selected Week's Ranking</button>
        </div>
        <div class="field"><label>Direct acceptances (main draw, no wildcard) — one player per line</label>
          <textarea class="entry-textarea" id="directList-${i}">${el2.direct.join('\n')}</textarea></div>
        <div class="field"><label>Wildcards — one player per line (should match the wildcard count above)</label>
          <textarea class="entry-textarea" id="wcList-${i}" style="min-height:70px">${(el2.wildcardNames||[]).join('\n')}</textarea></div>
        <div class="field"><label>Qualifying pool — one player per line</label>
          <textarea class="entry-textarea" id="qualList-${i}">${el2.qualifyingPool.join('\n')}</textarea></div>
        <div class="field"><label>Alternates — one player per line</label>
          <textarea class="entry-textarea" id="altList-${i}">${el2.alternates.join('\n')}</textarea></div>
        <button class="btn" onclick="event.stopPropagation();saveEntryList(${i})">Save Entry List</button>
        <button class="btn secondary" onclick="event.stopPropagation();clearEntryList(${i})">Clear</button>
      </div>`;
    }
  });

  el.innerHTML = `<div class="card">
    <h2>Entry Lists</h2>
    <p class="muted">Set these by hand, however far ahead you like (WTA typically locks them 3 weeks out — enter as many at once as you want). Click any tournament to open its editor. Either paste the full entrant list and hit Auto-Sort to split it into direct acceptances/qualifying by current ranking, or type the three lists yourself directly. Wildcards are separate either way — they're discretionary invites, not ranking-based. Draw seeding still always uses rankings from the week right before the tournament is played, not whatever they were when the entry list was set.</p>
    ${rows}
  </div>`;
}


let expandedResult = null;
function toggleResultView(idx){
  expandedResult = (expandedResult===idx) ? null : idx;
  renderResults();
}

function renderResults(){
  const el = document.getElementById('panel-results');
  const completed = STATE.calendar.map((e,i)=>({e,i})).filter(x=>x.e.category!=='BYE' && x.e.status==='completed');

  if(completed.length===0){
    el.innerHTML = `<div class="card"><h2>Results Archive</h2>
      <div class="empty-state">No tournaments completed yet — finish a draw in "This Week" and it'll show up here with the full bracket and every set score.</div>
    </div>`;
    return;
  }

  let lastMonth = null;
  let rows = '';
  completed.forEach(({e,i})=>{
    const month = e.date.split(' ')[0];
    if(month!==lastMonth){ rows += `<div class="month-label">${month}</div>`; lastMonth=month; }
    const draw = getArchivedDraw(i);
    const expanded = expandedResult===i;
    rows += `<div class="archive-row" onclick="toggleResultView(${i})">
      <div class="ev-week">Wk ${e.week}</div>
      <div class="ev-name">${e.name}</div>
      <div class="ev-city">${e.city}</div>
      <span class="ev-cat">${catLabel(e.category)}${e.drawSize?(' \u00b7 S'+e.drawSize):''}</span>
      <div class="ev-result">\ud83c\udfc6 ${e.result.champion} d. ${e.result.runnerup}</div>
    </div>`;
    if(expanded && draw){
      rows += `<div class="archive-detail">${draw.isRR ? renderReadonlyRR(draw) : renderReadonlyBracket(draw)}</div>`;
    } else if(expanded && !draw){
      rows += `<div class="archive-detail muted">No bracket data was saved for this event (it may have been completed before this feature was added).</div>`;
    }
  });

  el.innerHTML = `<div class="card">
    <h2>Results Archive <span class="muted">(${completed.length} completed)</span></h2>
    <p class="muted">Click any result to open its full bracket with every set score.</p>
    ${rows}
  </div>`;
}

function renderAll(){
  const wv = currentWeekVal();
  const pill = document.getElementById('weekPill');
  if(wv!=null){
    const names = currentWeekEvents().filter(x=>x.e.category!=='BYE').map(x=>x.e.name).join(' + ');
    pill.innerHTML = `Week ${wv}<small>${names || 'Bye week'}</small>`;
  } else {
    pill.textContent = 'Season complete';
  }
  renderSeason();
  renderEntryLists();
  renderDraw();
  renderResults();
  renderRankings();
  renderPoints();
}

(async function init(){
  await loadState();
  if(!STATE.archivedDraws) STATE.archivedDraws = {};
  if(!STATE.activeDraws) STATE.activeDraws = {};
  if(!STATE.qualifying) STATE.qualifying = {};
  if(!STATE.weeklySnapshots || Object.keys(STATE.weeklySnapshots).length===0){
    STATE.weeklySnapshots = {};
    captureSnapshotForWeek(currentWeekVal());
  }
  renderAll();
})();
</script>
</body>
</html>
